<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexível</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência</p>

    <picture>
        <source media="(max-width: 720px)" srcset="imagens/imagem-pequena.jpg">
        <source media="(max-width: 1120px)" srcset="imagens/imagem-media.jpg">
        <img src="imagens/imagem-grande.jpg" alt="Imagem flexível">
    </picture>
</body>
</html>
