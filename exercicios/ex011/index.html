<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Audio</h1>
    <p>
        Vamos aprender a reproduzir áudios em HTML5.
    </p>
    <!--A tag <audio> é compatível com MP3, M4A, WAV e OGG-->
    <audio src="midia/cinnamon-girl.mp3" controls autoplay></audio>
    <audio controls>
        <source src="midia/just-pretend.mp3" type="audio/mpeg">
        <source src="midia/just-pretend.ogg" type="audio/ogg">
        <source src="midia/just-pretend.wav" type="audio/mwav">
        <p>
            Infelizmente seu navegador não consegue reproduzir o áudio. <br>
            <a href="midia/just-pretend.mp3" download="midia/just-pretend.mp3">Clique aqui para baixar o áudio</a>
        </p>
    </audio>
    <audio src="midia/atlantis.m4a"controls autoplay></audio>
</body>
</html>
