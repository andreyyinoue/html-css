<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e Quebras de Linha</h1>
    <hr>
    <p>
        Você pode colocar qualquer coisa dentro da tag &lt;p&gt;
    </p>
    <p>
        Se você quiser quebrar a linha, use a tag &lt;br&gt;
    </p>
    <p>
        Adicionando alguns símbolos: <br>

        &reg;
        &copy;
        &trade;
        &euro;
        &yen;
        &pound;
        &cent;
        &delta;
        &Delta;
        &uparrow;
    </p>
    <p>
        Emojis
    </p>
    <p>
        &#x1F601;
    </p>

    
</body>
</html>
